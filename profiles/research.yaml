# Render with:  pixi run render research
cv:
  sections:
    # Headline retuned toward state-space / interpretability research.
    research_interests:
      - State-Space Models (Mamba/SSD), Linear-Time Sequence Models, Hardware-Aware Selective Scan, Hybrid Attention-SSM Models, Mechanistic Interpretability, Recurrent-Depth & Looped Transformers (Ouro/TRM/HRM), Scaling Laws.

    # Foreground research-relevant work first (architecture internals, dynamical
