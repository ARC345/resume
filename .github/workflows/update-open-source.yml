name: Update open-source contributions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyyaml

      - name: Update open source entries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_open_source.py

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Create draft pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update open-source contributions"
          title: "chore: update open-source contributions"
          body: |
            ## Summary
            - update open-source contribution entries from merged ARC345 pull requests
            - preserve existing manual entries in base and profile overlays
            - deduplicate entries by repository and pull request URL
          draft: true
          branch: automation/update-open-source-contributions
          delete-branch: true
